openapi: 3.1.0
info:
  title: TicketHub Idempotency
  version: 1.0.0
  description: >
    Shared Idempotency-Key header. Services reference it via
    $ref: '../common/idempotency.yaml#/components/parameters/IdempotencyKey' where a duplicate
    costs money (orders, payments) and OptionalIdempotencyKey where a duplicate is cheap
    (admin operations that create resources).
    The client generates a new key (UUID) once per operation and resends the same key on retries.
    The server keeps the key, a hash of the request body and the response for 24 hours.
    A retry with the same key gets the stored response. The same key with a different body
    is rejected with 422 IDEMPOTENCY_KEY_REUSED; a retry while the first request is still running
    is rejected with 409 REQUEST_IN_PROGRESS. Keys are scoped to the caller.
paths: {}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Unique key of the operation, generated by the client and reused on retries.
        Same key with a different body: 422 IDEMPOTENCY_KEY_REUSED.
        Same key while the first request is running: 409 REQUEST_IN_PROGRESS.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 3f2b8c1e-6a4d-4f7e-9b1a-2c5d8e9f0a1b
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Unique key of the operation, generated by the client and reused on retries.
        Without it the request is executed every time it is sent.
        Same key with a different body: 422 IDEMPOTENCY_KEY_REUSED.
        Same key while the first request is running: 409 REQUEST_IN_PROGRESS.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 3f2b8c1e-6a4d-4f7e-9b1a-2c5d8e9f0a1b
