services:
  postgresql:
    image: postgres:18
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?provide POSTGRES_USER variable in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?provide POSTGRES_PASSWORD variable in .env}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 1
    mem_limit: 512m

  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    cpus: 1
    mem_limit: 1536m

volumes:
  postgres_data:
